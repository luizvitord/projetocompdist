spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
# Ao receber SIGTERM (ex.: pod encerrado pelo Kubernetes), termina as requisicoes em andamento
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Atras do nginx do frontend e do Ingress: o IP do cliente vem do X-Forwarded-For, aceito so de
# proxies da rede interna (usado no rate limiting do login)
server.forward-headers-strategy=native

gateway.administrativa-url=${ADMINISTRATIVA_URL:http://localhost:8081}
gateway.escolar-url=${ESCOLAR_URL:http://localhost:8082}
gateway.usuarios-url=${USUARIOS_URL:http://localhost:8083}
gateway.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Segredo do JWT (HS256), o mesmo do usuarios-service. O padrao serve so para desenvolvimento local.
jwt.segredo=${JWT_SECRET:distrischool-segredo-de-desenvolvimento-local}

# Cliente HTTP das rotas: um servico lento ou fora do ar nao prende a thread da requisicao
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=10s

# Circuit breaker por rota (o id e o nome da rota). O TimeLimiter fica desligado: o limite de
# tempo e o read-timeout do cliente HTTP (o padrao do TimeLimiter, 1s, cortaria consultas lentas).
# Contam como falha erros de conexao e timeouts; respostas 5xx do servico passam sem alteracao.
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.gestao-escolar.base-config=default
resilience4j.circuitbreaker.instances.gestao-administrativa.base-config=default
resilience4j.circuitbreaker.instances.usuarios.base-config=default

# Novas tentativas so para GET, em erro de conexao e 502/503/504 (espera de 200ms, depois 400ms)
gateway.resiliencia.retry.novas-tentativas=2
gateway.resiliencia.retry.espera-inicial=200ms
# Rate limiting de POST /api/auth/login por IP, em cada replica do gateway
gateway.resiliencia.login.tentativas=10
gateway.resiliencia.login.periodo=1m

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Readiness e liveness so do proprio gateway: a queda de um servico de tras nao o tira do ar
# (o circuit breaker responde 503 para as rotas afetadas)
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.include=livenessState
