spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

gateway.administrativa-url=${ADMINISTRATIVA_URL:http://localhost:8081}
gateway.escolar-url=${ESCOLAR_URL:http://localhost:8082}
gateway.usuarios-url=${USUARIOS_URL:http://localhost:8083}
gateway.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Segredo do JWT (HS256), o mesmo do usuarios-service. O padrao serve so para desenvolvimento local.
jwt.segredo=${JWT_SECRET:distrischool-segredo-de-desenvolvimento-local}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
