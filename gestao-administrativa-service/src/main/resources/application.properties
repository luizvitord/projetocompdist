spring.application.name=gestao-administrativa-service
server.port=${SERVER_PORT:8081}
# Ao receber SIGTERM (ex.: pod encerrado pelo Kubernetes), termina as requisicoes em andamento
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/gestao_administrativa}
spring.datasource.username=${DB_USERNAME:gestao_administrativa}
spring.datasource.password=${DB_PASSWORD:gestao_administrativa}

# JPA: o schema e controlado exclusivamente pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka (produtor)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Consumidores de outros servicos nao conhecem as classes Java deste servico
spring.kafka.producer.properties.spring.json.add.type.headers=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
# O pod so recebe trafego quando o banco esta acessivel
management.endpoint.health.group.readiness.include=readinessState,db

# Swagger sob prefixo proprio: o Ingress expoe mais de um servico
springdoc.api-docs.path=/administrativa/v3/api-docs
springdoc.swagger-ui.path=/administrativa/swagger-ui.html
