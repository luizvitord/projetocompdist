server {
  listen 80;
  root /usr/share/nginx/html;
  # IP do navegador para o gateway (rate limiting do login por IP)
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  location /api/ { proxy_pass http://api-gateway:8080; }
  location /administrativa/ { proxy_pass http://api-gateway:8080; }
  location /escolar/ { proxy_pass http://api-gateway:8080; }
  # WebSocket das notificacoes (STOMP): direto para o notificacao-service, porque o gateway
  # (Spring Cloud Gateway Server MVC) nao faz proxy de WebSocket. O servico valida o JWT no frame CONNECT.
  location = /ws {
    proxy_pass http://notificacao-service:8084;
    # A troca de protocolo (Upgrade) so existe no HTTP/1.1 e nao e repassada por padrao
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Conexao longa: o padrao de 60 s a fecharia; os heartbeats STOMP (10 s) a mantem ativa
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
