server {
  listen 80;
  root /usr/share/nginx/html;
  # IP do navegador para o gateway (rate limiting do login por IP)
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  location /api/ { proxy_pass http://api-gateway:8080; }
  location /administrativa/ { proxy_pass http://api-gateway:8080; }
  location /escolar/ { proxy_pass http://api-gateway:8080; }
  location / { try_files $uri $uri/ /index.html; }
}
