# Infraestrutura local para desenvolvimento do gestao-administrativa-service, do gestao-escolar-service,
# do usuarios-service e do notificacao-service

# Healthcheck comum dos servicos Spring: /actuator/health/readiness so responde 200 quando o
# servico esta pronto para receber trafego (banco acessivel). A imagem eclipse-temurin:21-jre tem curl.
x-spring-healthcheck: &spring-healthcheck
  interval: 10s
  timeout: 3s
  retries: 3
  # Tempo para subir a JVM e aplicar as migrations do Flyway antes de contar falhas
  start_period: 90s

x-postgres-healthcheck: &postgres-healthcheck
  interval: 5s
  timeout: 3s
  retries: 10

services:
  postgres-administrativa:
    image: postgres:17
    environment:
      POSTGRES_DB: gestao_administrativa
      POSTGRES_USER: gestao_administrativa
      POSTGRES_PASSWORD: gestao_administrativa
    ports:
      - "15432:5432"
    volumes:
      - postgres-administrativa-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U gestao_administrativa -d gestao_administrativa"]

  postgres-escolar:
    image: postgres:17
    environment:
      POSTGRES_DB: gestao_escolar
      POSTGRES_USER: gestao_escolar
      POSTGRES_PASSWORD: gestao_escolar
    ports:
      - "15433:5432"
    volumes:
      - postgres-escolar-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U gestao_escolar -d gestao_escolar"]

  postgres-usuarios:
    image: postgres:17
    environment:
      POSTGRES_DB: usuarios
      POSTGRES_USER: usuarios
      POSTGRES_PASSWORD: usuarios
    ports:
      - "15434:5432"
    volumes:
      - postgres-usuarios-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U usuarios -d usuarios"]

  postgres-notificacao:
    image: postgres:17
    environment:
      POSTGRES_DB: notificacao
      POSTGRES_USER: notificacao
      POSTGRES_PASSWORD: notificacao
    ports:
      - "15435:5432"
    volumes:
      - postgres-notificacao-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U notificacao -d notificacao"]

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dois listeners: o cliente conecta no endereco anunciado pelo listener por onde entrou.
      # INTERNAL (kafka:29092) para os containers da rede do compose; EXTERNAL (localhost:9092)
      # para os servicos rodando direto na maquina.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      # O broker responde no listener interno, o mesmo que os servicos usam
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    environment:
      ADMINISTRATIVA_URL: http://gestao-administrativa-service:8081
      ESCOLAR_URL: http://gestao-escolar-service:8082
      USUARIOS_URL: http://usuarios-service:8083
      NOTIFICACAO_URL: http://notificacao-service:8084
      FRONTEND_ORIGIN: http://localhost:5173
      # Mesmo segredo do usuarios-service: o gateway valida os tokens que ele assina
      JWT_SECRET: distrischool-segredo-de-desenvolvimento-local
    ports: ["8080:8080"]
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
    # O gateway nao depende da saude dos servicos de tras (timeouts e circuit breaker); so
    # espera os containers existirem
    depends_on:
      gestao-administrativa-service: { condition: service_started }
      gestao-escolar-service: { condition: service_started }
      usuarios-service: { condition: service_started }
      notificacao-service: { condition: service_started }

  usuarios-service:
    build: ./usuarios-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-usuarios:5432/usuarios
      DB_USERNAME: usuarios
      DB_PASSWORD: usuarios
      JWT_SECRET: distrischool-segredo-de-desenvolvimento-local
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8083/actuator/health/readiness"]
    depends_on:
      postgres-usuarios: { condition: service_healthy }

  gestao-administrativa-service:
    build: ./gestao-administrativa-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-administrativa:5432/gestao_administrativa
      DB_USERNAME: gestao_administrativa
      DB_PASSWORD: gestao_administrativa
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/actuator/health/readiness"]
    depends_on:
      postgres-administrativa: { condition: service_healthy }
      kafka: { condition: service_healthy }

  gestao-escolar-service:
    build: ./gestao-escolar-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-escolar:5432/gestao_escolar
      DB_USERNAME: gestao_escolar
      DB_PASSWORD: gestao_escolar
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ADMINISTRATIVA_URL: http://gestao-administrativa-service:8081
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8082/actuator/health/readiness"]
    depends_on:
      postgres-escolar: { condition: service_healthy }
      kafka: { condition: service_healthy }
      # So para o fallback sincrono de turmas; a replica local funciona sem ele
      gestao-administrativa-service: { condition: service_started }

  notificacao-service:
    build: ./notificacao-service
    restart: unless-stopped
    # Tempo para o desligamento gracioso (~4 s): os consumidores avisam o Kafka que sairam do grupo.
    # Se o container for morto antes disso, o grupo fica parado ate o session timeout dos membros
    # antigos vencer, e as notificacoes atrasam depois de cada reinicio.
    stop_grace_period: 30s
    environment:
      DB_URL: jdbc:postgresql://postgres-notificacao:5432/notificacao
      DB_USERNAME: notificacao
      DB_PASSWORD: notificacao
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Mesmo segredo do usuarios-service: este servico tambem valida o token (API REST e WebSocket)
      JWT_SECRET: distrischool-segredo-de-desenvolvimento-local
    # Porta publicada para o modo de desenvolvimento do frontend: o proxy do Vite manda o /ws
    # (WebSocket) direto para ca, sem passar pelo gateway
    ports: ["8084:8084"]
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8084/actuator/health/readiness"]
    depends_on:
      postgres-notificacao: { condition: service_healthy }
      kafka: { condition: service_healthy }

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["5173:80"]
    # O nginx resolve os nomes api-gateway e notificacao-service (WebSocket) na subida
    depends_on:
      api-gateway: { condition: service_healthy }
      notificacao-service: { condition: service_started }

  # Monitoramento: o Prometheus coleta /actuator/prometheus de cada servico a cada 5 s
  # (monitoring/prometheus/) e o Grafana ja sobe com o datasource e o dashboard provisionados
  # (k8s/base/monitoring/grafana/, a mesma pasta que o Kustomize usa no Kubernetes)
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./k8s/base/monitoring/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:13.2.6
    restart: unless-stopped
    # 3001 no host: a 3000 fica livre
    ports: ["3001:3000"]
    environment:
      # Credenciais so de desenvolvimento
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: distrischool
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/distrischool-visao-geral.json
    volumes:
      - ./k8s/base/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./k8s/base/monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./k8s/base/monitoring/grafana/distrischool-visao-geral.json:/var/lib/grafana/dashboards/distrischool-visao-geral.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      prometheus: { condition: service_healthy }

volumes:
  prometheus-data:
  postgres-administrativa-data:
  postgres-escolar-data:
  postgres-usuarios-data:
  postgres-notificacao-data:
