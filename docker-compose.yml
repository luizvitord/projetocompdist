# Infraestrutura local para desenvolvimento do gestao-administrativa-service e do gestao-escolar-service
services:
  postgres-administrativa:
    image: postgres:17
    environment:
      POSTGRES_DB: gestao_administrativa
      POSTGRES_USER: gestao_administrativa
      POSTGRES_PASSWORD: gestao_administrativa
    ports:
      - "15432:5432"
    volumes:
      - postgres-administrativa-data:/var/lib/postgresql/data

  postgres-escolar:
    image: postgres:17
    environment:
      POSTGRES_DB: gestao_escolar
      POSTGRES_USER: gestao_escolar
      POSTGRES_PASSWORD: gestao_escolar
    ports:
      - "15433:5432"
    volumes:
      - postgres-escolar-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  api-gateway:
    build: ./api-gateway
    environment: { ADMINISTRATIVA_URL: http://gestao-administrativa-service:8081, ESCOLAR_URL: http://gestao-escolar-service:8082, FRONTEND_ORIGIN: http://localhost:5173 }
    ports: ["8080:8080"]
    depends_on: [gestao-administrativa-service, gestao-escolar-service]

  gestao-administrativa-service:
    build: ./gestao-administrativa-service
    environment:
      DB_URL: jdbc:postgresql://postgres-administrativa:5432/gestao_administrativa
      DB_USERNAME: gestao_administrativa
      DB_PASSWORD: gestao_administrativa
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: [postgres-administrativa, kafka]

  gestao-escolar-service:
    build: ./gestao-escolar-service
    environment:
      DB_URL: jdbc:postgresql://postgres-escolar:5432/gestao_escolar
      DB_USERNAME: gestao_escolar
      DB_PASSWORD: gestao_escolar
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADMINISTRATIVA_URL: http://gestao-administrativa-service:8081
    depends_on: [postgres-escolar, kafka, gestao-administrativa-service]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api-gateway]

volumes:
  postgres-administrativa-data:
  postgres-escolar-data:
