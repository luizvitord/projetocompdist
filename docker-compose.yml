# Infraestrutura local para desenvolvimento do gestao-administrativa-service e do gestao-escolar-service
services:
  postgres-administrativa:
    image: postgres:17
    environment:
      POSTGRES_DB: gestao_administrativa
      POSTGRES_USER: gestao_administrativa
      POSTGRES_PASSWORD: gestao_administrativa
    ports:
      - "15432:5432"
    volumes:
      - postgres-administrativa-data:/var/lib/postgresql/data

  postgres-escolar:
    image: postgres:17
    environment:
      POSTGRES_DB: gestao_escolar
      POSTGRES_USER: gestao_escolar
      POSTGRES_PASSWORD: gestao_escolar
    ports:
      - "15433:5432"
    volumes:
      - postgres-escolar-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  postgres-administrativa-data:
  postgres-escolar-data:
