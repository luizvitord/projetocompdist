apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: distrischool

resources:
  - namespace.yaml
  - postgres-administrativa/service.yaml
  - postgres-administrativa/statefulset.yaml
  - postgres-escolar/service.yaml
  - postgres-escolar/statefulset.yaml
  - postgres-usuarios/service.yaml
  - postgres-usuarios/statefulset.yaml
  - postgres-notificacao/service.yaml
  - postgres-notificacao/statefulset.yaml
  - kafka/service.yaml
  - kafka/statefulset.yaml
  - gestao-administrativa-service/service.yaml
  - gestao-administrativa-service/deployment.yaml
  - gestao-administrativa-service/hpa.yaml
  - gestao-administrativa-service/pdb.yaml
  - gestao-escolar-service/service.yaml
  - gestao-escolar-service/deployment.yaml
  - gestao-escolar-service/hpa.yaml
  - gestao-escolar-service/pdb.yaml
  - usuarios-service/service.yaml
  - usuarios-service/deployment.yaml
  - usuarios-service/hpa.yaml
  - usuarios-service/pdb.yaml
  - notificacao-service/service.yaml
  - notificacao-service/deployment.yaml
  - notificacao-service/hpa.yaml
  - notificacao-service/pdb.yaml
  - api-gateway/service.yaml
  - api-gateway/deployment.yaml
  - api-gateway/hpa.yaml
  - api-gateway/pdb.yaml
  - ingress.yaml
  # Monitoramento (acesso so por port-forward, fora do Ingress)
  - monitoring/prometheus/rbac.yaml
  - monitoring/prometheus/service.yaml
  - monitoring/prometheus/deployment.yaml
  - monitoring/grafana/service.yaml
  - monitoring/grafana/deployment.yaml

# Configuracao nao sensivel do gestao-administrativa-service (lida via envFrom).
# O Secret postgres-administrativa-credentials e definido em cada overlay.
configMapGenerator:
  - name: gestao-administrativa-config
    literals:
      - SERVER_PORT=8081
      - DB_URL=jdbc:postgresql://postgres-administrativa:5432/gestao_administrativa
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Logs em JSON, prontos para coleta centralizada (ELK)
      - LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs

  # Configuracao nao sensivel do gestao-escolar-service.
  # O Secret postgres-escolar-credentials e definido em cada overlay.
  - name: gestao-escolar-config
    literals:
      - SERVER_PORT=8082
      - DB_URL=jdbc:postgresql://postgres-escolar:5432/gestao_escolar
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Fallback sincrono para turmas que ainda nao chegaram a replica local
      - ADMINISTRATIVA_URL=http://gestao-administrativa-service:8081
      - LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
  # Configuracao nao sensivel do usuarios-service.
  # Os Secrets postgres-usuarios-credentials e jwt-secret sao definidos em cada overlay.
  - name: usuarios-config
    literals:
      - SERVER_PORT=8083
      - DB_URL=jdbc:postgresql://postgres-usuarios:5432/usuarios
      - LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
  # Configuracao nao sensivel do notificacao-service.
  # Os Secrets postgres-notificacao-credentials e jwt-secret sao definidos em cada overlay.
  - name: notificacao-config
    literals:
      - SERVER_PORT=8084
      - DB_URL=jdbc:postgresql://postgres-notificacao:5432/notificacao
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
  - name: api-gateway-config
    literals:
      - SERVER_PORT=8080
      - ADMINISTRATIVA_URL=http://gestao-administrativa-service:8081
      - ESCOLAR_URL=http://gestao-escolar-service:8082
      - USUARIOS_URL=http://usuarios-service:8083
      - NOTIFICACAO_URL=http://notificacao-service:8084
      - FRONTEND_ORIGIN=http://localhost:5173
  # Configuracao do Prometheus: descoberta de pods e as mesmas regras de alerta do Docker Compose
  - name: prometheus-config
    files:
      - monitoring/prometheus/prometheus.yml
      - monitoring/prometheus/alertas.yml
  # Provisionamento do Grafana: os mesmos arquivos que o Docker Compose monta
  - name: grafana-datasources
    files:
      - monitoring/grafana/datasources.yml
  - name: grafana-dashboards-provider
    files:
      - monitoring/grafana/dashboards.yml
  - name: grafana-dashboards
    files:
      - monitoring/grafana/distrischool-visao-geral.json
