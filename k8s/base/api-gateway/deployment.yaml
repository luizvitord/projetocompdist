apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, labels: { app.kubernetes.io/name: api-gateway, app.kubernetes.io/part-of: distrischool } }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
  template:
    metadata: { labels: { app.kubernetes.io/name: api-gateway, app.kubernetes.io/part-of: distrischool } }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: api-gateway
          image: api-gateway
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: api-gateway-config } }]
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
