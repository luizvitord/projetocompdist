apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: distrischool, labels: { app.kubernetes.io/part-of: distrischool } }
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: api-gateway, port: { name: http } } } }
          - { path: /administrativa, pathType: Prefix, backend: { service: { name: api-gateway, port: { name: http } } } }
          - { path: /escolar, pathType: Prefix, backend: { service: { name: api-gateway, port: { name: http } } } }
