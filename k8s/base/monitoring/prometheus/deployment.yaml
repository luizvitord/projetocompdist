# Uma replica, dados num emptyDir e retencao curta: e um Prometheus de demonstracao, e o minikube
# ja esta perto do limite de memoria. Se o pod for recriado, o historico recomeca.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: distrischool
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  # Dois Prometheus nao podem usar o mesmo diretorio de dados; com emptyDir nao ha conflito, mas
  # o Recreate tambem evita dois pods coletando ao mesmo tempo durante a troca
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: distrischool
    spec:
      serviceAccountName: prometheus
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # Usuario nobody da imagem oficial
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --storage.tsdb.retention.size=512MB
          ports:
            - name: http
              containerPort: 9090
          # Ate 2 min para subir (replay do WAL depois de um reinicio do container)
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            # O nome do ConfigMap muda quando o conteudo muda (sufixo do Kustomize), entao editar
            # prometheus.yml ou alertas.yml e reaplicar recria o pod com a configuracao nova
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: dados
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: dados
          emptyDir:
            sizeLimit: 1Gi
