# Escalabilidade horizontal pelo uso de CPU (requer o metrics-server no cluster)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: usuarios-service
  labels:
    app.kubernetes.io/name: usuarios-service
    app.kubernetes.io/part-of: distrischool
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: usuarios-service
  # Duas replicas no minimo: com uma so, o PodDisruptionBudget (minAvailable: 1) travaria o drain do no
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
