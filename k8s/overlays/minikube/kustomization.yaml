# Ambiente de desenvolvimento local (minikube).
# Uso: kubectl apply -k k8s/overlays/minikube
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# A imagem e construida direto no Docker do minikube (minikube image build),
# por isso nao ha registry nem pull
images:
  - name: gestao-administrativa-service
    newName: gestao-administrativa-service
    newTag: dev
  - name: gestao-escolar-service
    newName: gestao-escolar-service
    newTag: dev
  - name: api-gateway
    newName: api-gateway
    newTag: dev2

patches:
  - target:
      kind: Deployment
      name: gestao-administrativa-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: gestao-escolar-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

# Credenciais apenas de desenvolvimento. Em producao (EKS/AKS) o Secret
# deve vir de um cofre (AWS Secrets Manager / Azure Key Vault), nunca do repositorio.
secretGenerator:
  - name: postgres-administrativa-credentials
    namespace: distrischool
    literals:
      - POSTGRES_DB=gestao_administrativa
      - POSTGRES_USER=gestao_administrativa
      - POSTGRES_PASSWORD=gestao_administrativa
  - name: postgres-escolar-credentials
    namespace: distrischool
    literals:
      - POSTGRES_DB=gestao_escolar
      - POSTGRES_USER=gestao_escolar
      - POSTGRES_PASSWORD=gestao_escolar
