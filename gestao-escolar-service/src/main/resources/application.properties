spring.application.name=gestao-escolar-service
server.port=${SERVER_PORT:8082}
# Ao receber SIGTERM (ex.: pod encerrado pelo Kubernetes), termina as requisicoes em andamento
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15433/gestao_escolar}
spring.datasource.username=${DB_USERNAME:gestao_escolar}
spring.datasource.password=${DB_PASSWORD:gestao_escolar}

# JPA: o schema e controlado exclusivamente pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka (produtor)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Consumidores de outros servicos nao conhecem as classes Java deste servico
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Kafka (consumidor do schedule.updated)
spring.kafka.consumer.group-id=gestao-escolar-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Um JSON invalido nao trava o consumidor: o ErrorHandlingDeserializer entrega o erro ao error handler (DLT)
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# O produtor nao envia cabecalhos de tipo; o tipo de destino e definido em cada @KafkaListener
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Fallback sincrono: GET /api/turmas/{id} no gestao-administrativa-service
escolar.administrativa.url=${ADMINISTRATIVA_URL:http://localhost:8081}
escolar.administrativa.timeout=2s

# Falhas de conexao/timeout e respostas 5xx contam como falha e sao retentadas; 404 nao
resilience4j.retry.instances.administrativa.max-attempts=3
resilience4j.retry.instances.administrativa.wait-duration=300ms
resilience4j.retry.instances.administrativa.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.instances.administrativa.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.administrativa.sliding-window-size=10
resilience4j.circuitbreaker.instances.administrativa.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.administrativa.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.administrativa.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.administrativa.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.administrativa.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.administrativa.record-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
# O pod so recebe trafego quando o banco esta acessivel
management.endpoint.health.group.readiness.include=readinessState,db

# Swagger sob prefixo proprio: o Ingress expoe mais de um servico
springdoc.api-docs.path=/escolar/v3/api-docs
springdoc.swagger-ui.path=/escolar/swagger-ui.html
