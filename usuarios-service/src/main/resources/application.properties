spring.application.name=usuarios-service
server.port=${SERVER_PORT:8083}
# Ao receber SIGTERM (ex.: pod encerrado pelo Kubernetes), termina as requisicoes em andamento
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15434/usuarios}
spring.datasource.username=${DB_USERNAME:usuarios}
spring.datasource.password=${DB_PASSWORD:usuarios}

# JPA: o schema e controlado exclusivamente pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT assinado com HS256. O mesmo segredo e configurado no api-gateway, que valida os tokens.
# O valor padrao serve apenas para desenvolvimento local; no Kubernetes ele vem de um Secret.
jwt.segredo=${JWT_SECRET:distrischool-segredo-de-desenvolvimento-local}
jwt.validade=${JWT_VALIDADE:8h}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
# O pod so recebe trafego quando o banco esta acessivel
management.endpoint.health.group.readiness.include=readinessState,db

# Swagger sob prefixo proprio: o Ingress expoe mais de um servico
springdoc.api-docs.path=/usuarios/v3/api-docs
springdoc.swagger-ui.path=/usuarios/swagger-ui.html
