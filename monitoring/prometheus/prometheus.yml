# Prometheus do Docker Compose. Alvos estaticos: um container por servico, na rede do Compose.
# O rotulo "servico" e acrescentado aqui (a aplicacao nao o publica); os dashboards e os alertas
# agrupam por ele. No Kubernetes, o mesmo rotulo vem da descoberta de pods
# (k8s/base/monitoring/prometheus/).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: distrischool
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          servico: api-gateway
      - targets: ["gestao-administrativa-service:8081"]
        labels:
          servico: gestao-administrativa-service
      - targets: ["gestao-escolar-service:8082"]
        labels:
          servico: gestao-escolar-service
      - targets: ["usuarios-service:8083"]
        labels:
          servico: usuarios-service
      - targets: ["notificacao-service:8084"]
        labels:
          servico: notificacao-service
