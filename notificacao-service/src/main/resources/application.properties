spring.cloud.stream.kafka.bindings.scheduleUpdated-in-0.consumer.dlq-name=schedule.updated.DLT

# --- Entrega em tempo real entre replicas (fan-out) ---
# A replica que grava uma notificacao publica um aviso (id + destinatario) neste topico interno...
spring.cloud.stream.output-bindings=notificacaoCriada
spring.cloud.stream.bindings.notificacaoCriada-out-0.destination=notificacao.criada
# ...e TODAS as replicas o leem: sem "group", cada instancia ganha um grupo anonimo e recebe todos
# os avisos, para entregar as sessoes WebSocket conectadas nela. Sem novas tentativas nem DLT: um
# aviso perdido nao faz falta, a notificacao esta gravada e aparece na proxima consulta.
spring.cloud.stream.bindings.entregarNotificacao-in-0.destination=notificacao.criada
spring.cloud.stream.bindings.entregarNotificacao-in-0.consumer.max-attempts=1
# Com o Kafka fora do ar, o envio do aviso desiste em 5 s em vez de prender a thread por 60 s
spring.cloud.stream.kafka.binder.producer-properties.max.block.ms=5000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# O pod so recebe trafego quando o banco esta acessivel. O Kafka fica de fora: sem ele a API REST
# continua atendendo, e os eventos sao lidos quando ele voltar
management.endpoint.health.group.readiness.include=readinessState,db

# Swagger sob prefixo proprio: o Ingress expoe mais de um servico
springdoc.api-docs.path=/notificacao/v3/api-docs
springdoc.swagger-ui.path=/notificacao/swagger-ui.html
