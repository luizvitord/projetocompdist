spring.application.name=notificacao-service
server.port=${SERVER_PORT:8084}
# Ao receber SIGTERM (ex.: pod encerrado pelo Kubernetes), termina as requisicoes em andamento
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15435/notificacao}
spring.datasource.username=${DB_USERNAME:notificacao}
spring.datasource.password=${DB_PASSWORD:notificacao}

# JPA: o schema e controlado exclusivamente pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (HS256): o mesmo segredo do usuarios-service, que assina o token, e do api-gateway.
# O valor padrao serve apenas para desenvolvimento local; no Kubernetes ele vem de um Secret.
jwt.segredo=${JWT_SECRET:distrischool-segredo-de-desenvolvimento-local}

# --- Spring Cloud Stream (binder Kafka), estilo funcional ---
# Cada funcao e um bean Consumer de ConsumidoresConfig, ligado ao topico pelo binding <funcao>-in-0
spring.cloud.function.definition=gradePosted;attendanceRecorded;enrollmentCreated;enrollmentUpdated;studentCreated;teacherAssigned;staffCreated;scheduleUpdated;entregarNotificacao
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Os produtores criam os topicos com 3 particoes; se este servico subir antes, cria igual
spring.cloud.stream.kafka.binder.min-partition-count=3
spring.cloud.stream.kafka.binder.replication-factor=1
# Com o Kafka fora do ar na subida, o servico sobe assim mesmo e tenta ligar os consumidores de novo
spring.cloud.stream.binding-retry-interval=10
# Replica que cai sem se despedir do grupo (kill, falta de memoria, no fora do ar): o Kafka so
# redistribui as particoes dela, e libera o grupo para os outros, depois deste tempo. O padrao do
# cliente (45 s) deixaria as notificacoes paradas por quase um minuto.
spring.cloud.stream.kafka.binder.consumer-properties.session.timeout.ms=15000
spring.cloud.stream.kafka.binder.consumer-properties.heartbeat.interval.ms=3000

# Em todos os bindings de dominio:
#  - grupo notificacao-service: as replicas dividem as particoes (cada evento e processado uma vez);
#    o grupo guarda o offset, entao eventos publicados com o servico parado sao lidos na volta
#  - 3 tentativas no total, com espera de 1 s e depois 2 s
#  - depois disso (ou na hora, para MensagemInvalidaException) o registro vai para <topico>.DLT;
#    o nome e explicito porque o padrao do binder e error.<topico>.<grupo>
spring.cloud.stream.bindings.gradePosted-in-0.destination=grade.posted
spring.cloud.stream.bindings.gradePosted-in-0.group=notificacao-service
spring.cloud.stream.bindings.gradePosted-in-0.consumer.max-attempts=3
spring.cloud.stream.bindings.gradePosted-in-0.consumer.back-off-initial-interval=1000
spring.cloud.stream.bindings.gradePosted-in-0.consumer.back-off-multiplier=2.0
spring.cloud.stream.bindings.gradePosted-in-0.consumer.back-off-max-interval=2000
spring.cloud.stream.bindings.gradePosted-in-0.consumer.retryable-exceptions.com.distrischool.notificacao.common.MensagemInvalidaException=false
spring.cloud.stream.kafka.bindings.gradePosted-in-0.consumer.enable-dlq=true
spring.cloud.stream.kafka.bindings.gradePosted-in-0.consumer.dlq-name=grade.posted.DLT

spring.cloud.stream.bindings.attendanceRecorded-in-0.destination=attendance.recorded
